name: Release note.pdf

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      TYPST_VERSION: 0.14.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Typst
        run: |
          curl -fsSL \
            -o typst.tar.xz \
            "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          tar -xJf typst.tar.xz
          sudo install -m 0755 ./typst-*/typst /usr/local/bin/typst
          typst --version

      - name: Install fonts for CJK rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-core fonts-noto-mono fonts-arphic-ukai
          fc-cache -fv
          fc-list : family | sort -u | grep -E "AR PL UKai CN|Noto Sans CJK SC|Noto Sans Mono|Noto Serif CJK SC"

      - name: Compile naturelanguageprocess.pdf
        run: typst compile typst/note.typ NatureLanguageProcess.pdf

      - name: Create GitHub Release and upload PDF
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" NatureLanguageProcess.pdf --clobber
          else
            gh release create "${GITHUB_REF_NAME}" NatureLanguageProcess.pdf --generate-notes --title "${GITHUB_REF_NAME}"
          fi
