name: Build and release note PDFs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: note-pdfs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      TYPST_VERSION: 0.14.2
      TYPST_PDF: NatureLanguageProcess-typst.pdf
      LATEX_PDF: NatureLanguageProcess-latex.pdf

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Typst
        run: |
          curl -fsSL \
            -o typst.tar.xz \
            "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          tar -xJf typst.tar.xz
          sudo install -m 0755 ./typst-*/typst /usr/local/bin/typst
          typst --version

      - name: Install PDF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            biber \
            fonts-arphic-ukai \
            fonts-noto-cjk \
            fonts-noto-core \
            fonts-noto-mono \
            fonts-texgyre \
            latexmk \
            tex-gyre \
            texlive-bibtex-extra \
            texlive-fonts-extra \
            texlive-fonts-recommended \
            texlive-lang-chinese \
            texlive-latex-extra \
            texlive-xetex
          fc-cache -fv
          xelatex --version
          latexmk -v
          fc-list : family | sort -u | grep -E "AR PL UKai CN|Noto Sans CJK SC|Noto Sans Mono|Noto Serif CJK SC"

      - name: Compile Typst PDF
        run: typst compile typst/note.typ "${TYPST_PDF}"

      - name: Compile LaTeX PDF
        run: |
          mkdir -p /tmp/nlpnote-latex/chapters
          (
            cd latex
            latexmk -norc -xelatex -interaction=nonstopmode -halt-on-error -outdir=/tmp/nlpnote-latex note.tex
          )
          cp /tmp/nlpnote-latex/note.pdf "${LATEX_PDF}"

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: note-pdfs
          path: |
            ${{ env.TYPST_PDF }}
            ${{ env.LATEX_PDF }}

      - name: Create GitHub Release and upload PDFs
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=("${TYPST_PDF}" "${LATEX_PDF}")
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" --generate-notes --title "${GITHUB_REF_NAME}"
          fi
